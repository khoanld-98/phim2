  golang:
    build: .
    container_name: story-golang
    restart: always
    ports:
      - 8000:8080
    command: "nodemon --exec go run main.go --signal SIGTERM"
    volumes:
      - .:/app
    depends_on:
      - mysql
    networks:
      - story

