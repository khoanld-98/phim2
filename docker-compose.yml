version: '3.9'

services:
  mysql:
    platform: linux/x86_64
    image: mysql:5.7
    container_name: mysql_story
    restart: always
    environment:
      MYSQL_USER: gotest
      MYSQL_PASSWORD: gotest
      MYSQL_ROOT_PASSWORD: gotest
      MYSQL_DATABASE: story
    ports:
      - 3309:3306
    volumes:
      - db:/var/lib/mysql
    networks:
      - story

  # nginxgo:
  #   image: nginx:1.24.0-alpine
